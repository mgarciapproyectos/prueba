<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEPTON · A/B Test 1 — Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sheets.css" />
</head>
<body>
  <div class="stage-side">
    <div class="variant-tag">Test 1 · Variante A — Sheet</div>
    <a href="index.html">← Elegir prototipo</a>
    <button type="button" onclick="location.reload()">↻ Reiniciar flujo</button>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.8" fill="#111"/><rect x="5" y="5" width="3" height="7" rx="0.8" fill="#111"/><rect x="10" y="2.5" width="3" height="9.5" rx="0.8" fill="#111"/><rect x="15" y="0" width="3" height="12" rx="0.8" fill="#111"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.6a1.7 1.7 0 100 2.4 1.7 1.7 0 000-2.4z" fill="#111"/><path d="M8 5.4c1.7 0 3.2.7 4.3 1.8l-1.5 1.5A4 4 0 008 7.5a4 4 0 00-2.8 1.2L3.7 7.2A6.1 6.1 0 018 5.4z" fill="#111"/><path d="M8 1.2c2.8 0 5.4 1.1 7.3 3l-1.5 1.5A8.3 8.3 0 008 3.3 8.3 8.3 0 002.2 5.7L.7 4.2a10.4 10.4 0 017.3-3z" fill="#111"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#111" opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.8" fill="#111"/><path d="M23 4v4c0.9-0.3 1.5-1.1 1.5-2S23.9 4.3 23 4z" fill="#111" opacity="0.5"/></svg>
        </span>
      </div>

      <div class="chat-header">
        <button id="icBack" type="button" data-action="toast" data-value="Salir del asistente (demo)"></button>
        <span class="ch-title">Asistente de Tableros</span>
        <button id="icStar" type="button" data-action="toast" data-value="Guardado en favoritos"></button>
      </div>

      <div class="chat-body" id="chatBody"></div>

      <div class="chat-inputbar">
        <div class="inputbar-tip" id="inputHint"></div>
        <div class="inputbar-row">
          <div class="input-pill">
            <button class="ib-ic" id="sendHit" type="button" aria-label="Buscar"></button>
            <input id="chatInput" placeholder="Escribe tu respuesta aquí…" autocomplete="off" enterkeyhint="send" />
          </div>
          <button class="send-btn" id="sendBtn" type="button" aria-label="Enviar mensaje" disabled></button>
        </div>
      </div>

      <div class="toast" id="toast"></div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script src="js/core/catalog.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/chat.js"></script>
  <script src="js/ui/sheet.js"></script>
  <script src="js/ui/render.js"></script>
  <script src="js/ui/bootstrap.js"></script>
  <script src="js/flows/guided.js"></script>
  <script src="js/flows/ab1-shared.js"></script>
  <script src="js/flows/ab1-sheet.js"></script>
</body>
</html>
